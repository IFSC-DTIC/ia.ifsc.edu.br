  <!-- Redirecionamento Imediato para abrir a Caixa Suspensa Oficial no Portal de IA do IFSC -->
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('noredirect') === '1' || params.get('noredirect') === 'true') return;
      var parts = window.location.pathname.split('/').filter(Boolean);
      var base = (window.location.hostname.endsWith('github.io') && parts.length > 1) ? '/' + parts[0] + '/' : '/';
      window.location.replace(base + '?app=ripd&tab=tools');
    })();
  </script>

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme') || localStorage.getItem('color-theme');
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    })();
    window.tailwind = { config: { darkMode: 'class' } };
  </script>
